apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: healthpulse

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: 133197206805.dkr.ecr.us-east-1.amazonaws.com/healthpulse-frontend:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 80
